name: Build and publish ZFLAG v2.0.56 Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'zflag-desktop-source.b64'
      - '.github/workflows/build-zflag-windows.yml'
      - 'release/zflag-v250-live-bulk-patch.py'
      - 'release/zflag-v252-process-detection-fix.py'
      - 'release/zflag-v253-ui-pacing-fix.py'
      - 'release/zflag-v254-tab-results-game-tuner.py'
      - 'release/zflag-v255-native-failure-reporting.py'
      - 'release/zflag-v256-green-live-progress.py'

permissions:
  contents: write

concurrency:
  group: zflag-windows-release
  cancel-in-progress: false

jobs:
  build-installer:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify ZFLAG v2.0.49 release source
        shell: pwsh
        run: |
          $encoded = (Get-Content -LiteralPath 'zflag-desktop-source.b64' -Raw).Trim()
          $bytes = [Convert]::FromBase64String($encoded)
          $hash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if ($hash -ne '6ed33023f232918b0fc3d3191c3a8264a99ff2bed95b30755b19f223f155fd9e') {
            throw "Source hash mismatch: $hash"
          }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'zflag-desktop-source.zip'), $bytes)
          Expand-Archive -LiteralPath 'zflag-desktop-source.zip' -DestinationPath '_work' -Force
          $root = '_work/ZFLAG-Studio'
          if (-not (Test-Path "$root/backend/zflag_bulk_safe.py")) { throw '20k bulk-safety module missing' }
          if (-not (Test-Path "$root/backend/zflag_updater.py")) { throw 'Updater missing' }
          if (-not (Test-Path "$root/native-enhanced/fastflag_injector_gui_enhanced.cpp")) { throw 'Enhanced injector missing' }
          $cfg = Get-Content "$root/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $package = Get-Content "$root/package.json" -Raw | ConvertFrom-Json
          if ($cfg.version -ne '2.0.49' -or $package.version -ne '2.0.49') { throw 'App versions are not 2.0.49' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade source to v2.0.50 with paced live injection
        shell: pwsh
        run: |
          python release/zflag-v250-live-bulk-patch.py _work/ZFLAG-Studio
          if ($LASTEXITCODE -ne 0) { throw 'ZFLAG 2.0.50 source upgrade failed' }
          $cfg=Get-Content '_work/ZFLAG-Studio/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($cfg.version -ne '2.0.50') { throw 'Expected patched app version 2.0.50' }
      - name: Restore tested pre-install shutdown hook and upgrade regression (v2.0.51)
        shell: pwsh
        run: |
          # v2.0.50 regressed the old installer upgrade hook: a running backend
          # keeps its executable locked. Reapply the earlier tested fix against
          # the updated v2.0.50 source, with v2.0.51 installer metadata.
          $legacy = Get-Content 'release/v2.0.41-upgrade-fix.ps1' -Raw
          if (-not $legacy.Contains('NSIS_HOOK_PREINSTALL')) { throw 'Reliable upgrade hook source missing' }
          $repair = $legacy.Replace('2.0.40','2.0.50').Replace('2.0.41','2.0.51')
          Set-Content -LiteralPath 'release/v2.0.51-upgrade-fix.ps1' -Value $repair -Encoding utf8
          & ./release/v2.0.51-upgrade-fix.ps1
          if (-not (Test-Path '_work/ZFLAG-Studio/src-tauri/installer/zflag-shortcuts.nsh')) { throw 'Installer hook missing' }
          $hook = Get-Content '_work/ZFLAG-Studio/src-tauri/installer/zflag-shortcuts.nsh' -Raw
          if (-not $hook.Contains('!macro NSIS_HOOK_PREINSTALL') -or -not $hook.Contains('taskkill.exe')) { throw 'Pre-install backend shutdown hook missing' }
          # Update the source tests that explicitly asserted the obsolete
          # no-preinstall-hook behavior and the previous application version.
          $integrity = '_work/ZFLAG-Studio/tests/test_release_integrity.py'
          $test = Get-Content $integrity -Raw
          if (-not $test.Contains("self.assertNotIn('NSIS_HOOK_PREINSTALL',hook)")) { throw 'Installer regression test anchor changed' }
          $test = $test.Replace("self.assertNotIn('NSIS_HOOK_PREINSTALL',hook)","self.assertIn('NSIS_HOOK_PREINSTALL',hook)")
          $test = $test.Replace("('2.0.50','2.0.50')","('2.0.51','2.0.51')")
          $test | Set-Content -LiteralPath $integrity -Encoding utf8
          $bulkTest = '_work/ZFLAG-Studio/tests/test_large_json_safety_248.py'
          (Get-Content $bulkTest -Raw).Replace('2.0.50','2.0.51') | Set-Content -LiteralPath $bulkTest -Encoding utf8
          # Keep Tauri, package and Rust metadata consistent.
          $cargo = '_work/ZFLAG-Studio/src-tauri/Cargo.toml'
          $cargoData = Get-Content $cargo -Raw
          $cargoData = $cargoData.Replace('version = "2.0.49"','version = "2.0.51"')
          $cargoData | Set-Content -LiteralPath $cargo -Encoding utf8
          $cfg = Get-Content '_work/ZFLAG-Studio/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $pkg = Get-Content '_work/ZFLAG-Studio/package.json' -Raw | ConvertFrom-Json
          if ($cfg.version -ne '2.0.51' -or $pkg.version -ne '2.0.51') { throw 'Version bump failed' }
      - name: Apply v2.0.52 process status and UI fixes
        shell: pwsh
        run: |
          python release/zflag-v252-process-detection-fix.py _work/ZFLAG-Studio
          if ($LASTEXITCODE -ne 0) { throw 'v2.0.52 diagnostic patch failed' }
          $config=Get-Content '_work/ZFLAG-Studio/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($config.version -ne '2.0.52') { throw 'v2.0.52 version check failed' }
      - name: Polish Roblox status, remove native popup, and show bulk ETA (v2.0.53)
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          python release/zflag-v253-ui-pacing-fix.py _work/ZFLAG-Studio
          if ($LASTEXITCODE -ne 0) { throw 'v2.0.53 UI and pacing source patch failed' }
          $conf = Get-Content '_work/ZFLAG-Studio/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($conf.version -ne '2.0.53') { throw 'Expected v2.0.53 after patch' }
      - name: Correct per-tab results and add nondestructive game profiles (v2.0.54)
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          python release/zflag-v254-tab-results-game-tuner.py _work/ZFLAG-Studio
          if ($LASTEXITCODE -ne 0) { throw 'v2.0.54 results/game patch failed' }
          $cfg=Get-Content '_work/ZFLAG-Studio/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($cfg.version -ne '2.0.54') { throw 'Expected v2.0.54' }
          $ui=Get-Content '_work/ZFLAG-Studio/src/App.tsx' -Raw
          if (-not $ui.Contains('snapshotMatchesTab') -or -not $ui.Contains('gameTunePlan')) { throw 'UI regression' }
          $preserve=Get-Content '_work/ZFLAG-Studio/src/gameTuner.ts' -Raw
          if (-not $preserve.Contains('const flags = { ...original }')) { throw 'Original flag preservation missing' }
      - name: Preserve validated native failure details (v2.0.55)
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          python release/zflag-v255-native-failure-reporting.py _work/ZFLAG-Studio
          if ($LASTEXITCODE -ne 0) { throw 'v2.0.55 native outcome repair failed' }
          $cfg=Get-Content '_work/ZFLAG-Studio/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($cfg.version -ne '2.0.55') { throw 'Expected v2.0.55' }
          $backend=Get-Content '_work/ZFLAG-Studio/backend/server.py' -Raw
          if (-not $backend.Contains('verified_all_failed')) { throw 'Native failure-handling fix missing' }
      - name: Stream native progress and show green detected state (v2.0.56)
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          python release/zflag-v256-green-live-progress.py _work/ZFLAG-Studio
          if ($LASTEXITCODE -ne 0) { throw 'v2.0.56 progress patch failed' }
          $cfg=Get-Content '_work/ZFLAG-Studio/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($cfg.version -ne '2.0.56') { throw 'v2.0.56 version check failed' }
          $backend=Get-Content '_work/ZFLAG-Studio/backend/server.py' -Raw
          if (-not $backend.Contains('Receiving native acknowledgments')) { throw 'Live progress source missing' }
      - name: Validate bulk-safety, UI, and release regressions
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: |
          $env:PYTHONUTF8 = '1'
          python -m pip install --disable-pip-version-check -q pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow dependency setup failed' }
          python -m unittest discover -s tests -p 'test_*.py' -q
          if ($LASTEXITCODE -ne 0) { throw 'Offline regression tests failed; no release will be published' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build React UI
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Compile Enhanced C++ injector and bundle Python sidecar
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: ./scripts/build-sidecar.ps1
      - name: Compile NSIS one-click Windows installer
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: ./scripts/build-tauri-with-msvc.ps1
      - name: Verify native engine, sidecar, and installer files
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: ./scripts/verify-windows-release.ps1
      - name: Stage EXE and checksum
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: |
          New-Item -ItemType Directory -Force -Path 'release' | Out-Null
          $exe = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'NSIS installer not found' }
          Copy-Item $exe.FullName 'release/ZFLAG_Setup.exe' -Force
          (Get-FileHash 'release/ZFLAG_Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content 'release/ZFLAG_Setup_SHA256.txt'
          if ((Get-Item 'release/ZFLAG_Setup.exe').Length -lt 5000000) { throw 'Installer unexpectedly small' }
      - name: Smoke-test installed app and updater on Windows
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: ./scripts/smoke-test-installed-app.ps1
      - name: Upload tested EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZFLAG-v2.0.56-Windows-EXE
          path: |
            _work/ZFLAG-Studio/release/ZFLAG_Setup.exe
            _work/ZFLAG-Studio/release/ZFLAG_Setup_SHA256.txt
          if-no-files-found: error
      - name: Publish official v2.0.56 release after successful smoke test
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.56
          name: ZFLAG v2.0.56 for Windows
          draft: false
          prerelease: false
          body: |
            Green detected badge (without claiming memory access), real-time progress based on validated native checkpoint rows (500ms UI polling), live in-tab progress bar and accurate counts. Presets may contain up to 100,000 JSON entries but arbitrary flags may be unsupported or unsafe. No anti-cheat bypass or unverified success claims. Native injection now preserves verified per-flag failure details even if all flags fail, and accepts evidence-backed mixed legacy results instead of hiding them behind a generic error. This is a reporting/diagnostics fix, not a Roblox write bypass or guarantee. Tab-specific scores no longer reuse results from other JSONs; interrupted batches store their per-tab reported writes, failures, and unattempted flags. A read-only, best-effort current place ID detector and a reversible graphics tuner create a new copy retaining every original key. No game optimizations are applied automatically. The header now uses green for Roblox detected, with a separate diagnostic for memory access readiness. Large preset injection no longer shows a blocking browser confirmation; it displays live progress and estimated time remaining. Only the extra inter-batch wait is shortened from 0.5s to 0.25s; native batch size and crash-stop checks are unchanged. Updated Roblox status distinguishes a detected process from process-access readiness, adds diagnostics for failures, fixes the confirmation message, and hides results from a different preset. Standalone Windows installer. Large JSON presets now offer an explicitly confirmed experimental Inject action using paced 32-flag Enhanced native batches, per-batch progress and Stop control. A separate Stage safe config action retains allowlist-only startup staging. Includes one-click updater.
            Fixes the installer regression that left older ZFLAG backends running, locking fflag-backend.exe during upgrades. Includes a Windows smoke test that reinstalls with GUI/backend running. Live injection can still freeze or crash Roblox; this build does not guarantee 20k flags take effect. The live path is manually confirmed, stops if Roblox exits/restarts, and does not attempt a huge single memory-write batch.
            Automated offline regressions, Windows installer smoke test, backend startup, and update authorization tests passed. In-game Roblox injection is not covered by CI. Installer is unsigned.
          files: |
            _work/ZFLAG-Studio/release/ZFLAG_Setup.exe
            _work/ZFLAG-Studio/release/ZFLAG_Setup_SHA256.txt
      - name: Switch official website to verified v2.0.56 EXE
        shell: pwsh
        run: |
          $site='index.html'
          $raw=Get-Content -LiteralPath $site -Raw
          if (-not $raw.Contains('v2.0.55')) { throw 'Expected v2.0.55 website fallback not found; site left untouched' }
          $new=$raw.Replace('2.0.55','2.0.56')
          $new | Set-Content -LiteralPath $site -Encoding utf8
          $readme='README.md'
          $info=Get-Content -LiteralPath $readme -Raw
          $info=$info.Replace('Download ZFLAG_Setup.exe — v2.0.55','Download ZFLAG_Setup.exe — v2.0.56').Replace('releases/download/v2.0.55/ZFLAG_Setup.exe','releases/download/v2.0.56/ZFLAG_Setup.exe')
          $info | Set-Content -LiteralPath $readme -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md
          git commit -m 'Update ZFLAG website download to verified v2.0.56'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit website release update' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish updated website' }
