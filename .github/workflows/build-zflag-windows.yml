name: Build ZFLAG Windows one-click installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'zflag-desktop-source.b64'
      - 'release/v2.0.41-upgrade-fix.ps1'
      - '.github/workflows/build-zflag-windows.yml'

permissions:
  contents: write

concurrency:
  group: zflag-windows-release
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout site and release source
        uses: actions/checkout@v4
      - name: Verify maintainer source archive exists
        shell: pwsh
        run: |
          if (-not (Test-Path zflag-desktop-source.b64)) { throw 'Missing zflag-desktop-source.b64 in the repository. Upload the maintainer source zip first.' }

          $encoded = (Get-Content -LiteralPath zflag-desktop-source.b64 -Raw).Trim()
          $bytes = [Convert]::FromBase64String($encoded)
          $actualHash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          $expectedHash = 'db74d218e8959c2049f631a4b3e8163735de7dad75faf5cfed0701301e4961f2'
          if ($actualHash -ne $expectedHash) { throw "Source integrity mismatch: $actualHash" }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'zflag-desktop-source.zip'), $bytes)
          Expand-Archive -LiteralPath zflag-desktop-source.zip -DestinationPath _work -Force
          if (-not (Test-Path '_work/ZFLAG-Studio/.github/workflows/release-windows.yml')) { throw 'The ZIP does not contain the complete ZFLAG Studio release source.' }
          $conf = Get-Content '_work/ZFLAG-Studio/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($conf.version -ne '2.0.40') { throw "Unexpected installer release version: $($conf.version)" }
      - name: Preserve reliable ZFLAG 2.0.41 installer upgrade fix
        shell: pwsh
        run: ./release/v2.0.41-upgrade-fix.ps1
      - name: Set new 2.0.46 product version and regression expectations
        shell: pwsh
        run: |
          $targets = @(
            '_work/ZFLAG-Studio/src-tauri/tauri.conf.json',
            '_work/ZFLAG-Studio/package.json',
            '_work/ZFLAG-Studio/scripts/smoke-test-installed-app.ps1'
          )
          foreach ($path in $targets) {
            $contents = Get-Content $path -Raw
            if (-not $contents.Contains('2.0.41')) { throw "Missing 2.0.41 upgrade version in $path" }
            $contents.Replace('2.0.41','2.0.46') | Set-Content $path -Encoding utf8
          }
          $cfg = Get-Content '_work/ZFLAG-Studio/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($cfg.version -ne '2.0.46' -or $cfg.app.windows[0].transparent -ne $false) {
            throw '2.0.46 version or opaque WebView configuration invalid'
          }
      - name: Replace Play icons with proper injection icons in desktop
        shell: pwsh
        run: |
          $file = '_work/ZFLAG-Studio/src/App.tsx'
          $app = [IO.File]::ReadAllText((Join-Path $PWD $file))
          if (([regex]::Matches($app,'<Play className=')).Count -ne 4 -or -not $app.Contains('  Play,')) {
            throw 'Unexpected injection UI source. Refusing icon-only release.'
          }
          $app = $app.Replace('  Play,','  Syringe,').Replace('<Play className=', '<Syringe className=')
          [IO.File]::WriteAllText((Join-Path $PWD $file),$app,[Text.UTF8Encoding]::new($false))
          if (([regex]::Matches($app,'<Syringe className=')).Count -ne 4 -or $app.Contains('<Play className=')) {
            throw 'Injection icons were not all replaced.'
          }
          $test = @'
          from pathlib import Path
          APP = (Path(__file__).resolve().parents[1] / "src" / "App.tsx").read_text(encoding="utf-8")
          def test_injection_button_uses_syringe_not_play():
              assert '  Syringe,' in APP
              assert '<Play className=' not in APP
              assert 'busy ? <LoaderCircle className="size-3.5 animate-spin" /> : <Syringe className="size-3.5" />' in APP
          def test_all_inject_entry_points_are_consistent():
              assert APP.count('<Syringe className=') == 4
              assert APP.count('<Syringe className="size-3.5" /> Apply supported only') == 2
          '@
          $test | Set-Content '_work/ZFLAG-Studio/tests/test_injection_action_icons_246.py' -Encoding utf8
      - name: Verify UI stability and branding regression tests
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: |
          # Maintain the baseline test expectations across the verified 2.0.41 upgrade patch.
          $integrity = 'tests/test_release_integrity.py'
          $source = Get-Content $integrity -Raw
          if (-not $source.Contains("self.assertNotIn('NSIS_HOOK_PREINSTALL',hook)")) { throw 'Unexpected NSIS regression test' }
          $source = $source.Replace("self.assertNotIn('NSIS_HOOK_PREINSTALL',hook)", "self.assertIn('NSIS_HOOK_PREINSTALL',hook)")
          $source = $source.Replace("('2.0.40','2.0.40')", "('2.0.46','2.0.46')")
          $source | Set-Content $integrity -Encoding utf8
          $env:PYTHONUTF8 = '1'
          python -m pip install pytest pillow --disable-pip-version-check -q
          if ($LASTEXITCODE -ne 0) { throw 'pytest setup failed' }
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'UI stability regression tests failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install and build frontend
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'frontend compile failed' }
      - name: Compile the original working C++ injector and backend
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: ./scripts/build-sidecar.ps1
      - name: Package branded one-file ZFLAG NSIS installer
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: ./scripts/build-tauri-with-msvc.ps1
      - name: Verify native CLI and installer output
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: ./scripts/verify-windows-release.ps1
      - name: Prepare one public Windows installer
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw 'NSIS .exe missing' }
          Copy-Item $setup.FullName 'release/ZFLAG_Setup.exe' -Force
          (Get-FileHash 'release/ZFLAG_Setup.exe' -Algorithm SHA256).Hash | Set-Content 'release/ZFLAG_Setup_SHA256.txt'
      - name: Test the real installer on Windows, including shortcut replacement
        shell: pwsh
        working-directory: _work/ZFLAG-Studio
        run: ./scripts/smoke-test-installed-app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ZFLAG-v2.0.46-Windows-EXE
          path: |
            _work/ZFLAG-Studio/release/ZFLAG_Setup.exe
            _work/ZFLAG-Studio/release/ZFLAG_Setup_SHA256.txt
          if-no-files-found: error
      - name: Publish verified EXE for the website download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.46
          name: ZFLAG 2.0.46 for Windows
          body: |
            One-click Windows x64 installer. Download `ZFLAG_Setup.exe`, run it, and launch ZFLAG.
            No .bat, ZIP extraction, or development tools needed.
            Installer and local backend integration passed automated Windows checks, including a reinstallation while the ZFLAG GUI and backend are still running.
            Preserves the running-backend installer repair; uses an opaque Windows WebView2 window and the user's new metallic Z branding; limits UI polling and prevents duplicate apply requests.
            Updated to the owner's official matte silver Z mark and consistent Bklit-inspired UI controls in Editor, Settings, Library and Agent.\n            Enhanced engine availability updates now refresh Inject correctly. Partial apply results show failed flags.\n            Native writes are checkpointed one flag at a time. An interrupted or timed-out batch preserves exact confirmed writes and marks remaining flags unconfirmed rather than a blanket failure. The app uses a batch-sized timeout, no majority-only success heuristic, and a distinct unavailable-result warning for lost responses.\n            Live in-game Roblox effects and exact end-user GPU flickering remain untested in CI.
            Replaces the generic Play triangle with a clean injection/syringe symbol in the Inject button, Home quick action and both Apply-supported actions. UI-only fix: native engine and result recovery are unchanged.\n            Unsigned EXE: Windows SmartScreen may warn.
          files: |
            _work/ZFLAG-Studio/release/ZFLAG_Setup.exe
            _work/ZFLAG-Studio/release/ZFLAG_Setup_SHA256.txt
          draft: false
          prerelease: false
