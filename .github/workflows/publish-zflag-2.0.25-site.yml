name: Publish ZFLAG 2.0.25 site references
on:
  push:
    paths:
      - ".github/workflows/publish-zflag-2.0.25-site.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align existing site with verified Windows installer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assert Path("ZFLAG-Setup-v2.0.25.exe").is_file(), "Verified installer absent"
          for filename in ("index.html","README.md","render.yaml","DEPLOY-TO-RENDER.txt"):
              p=Path(filename)
              s=p.read_text(encoding="utf-8")
              new=s.replace("2.0.24","2.0.25")
              p.write_text(new,encoding="utf-8")
              print(filename, "updated", s!=new)
          html=Path("index.html").read_text(encoding="utf-8")
          assert 'ZFLAG-Setup-v2.0.25.exe' in html, "Wrong download target"
          PY
          git config user.name "ZFLAG Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html README.md render.yaml DEPLOY-TO-RENDER.txt
          git diff --cached --quiet || (git commit -m "Point ZFLAG website downloads to verified 2.0.25" && git push)
