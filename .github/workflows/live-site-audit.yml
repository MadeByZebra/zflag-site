name: Live ZFLAG visual and interaction audit
on:
  push:
    paths:
      - '.github/workflows/live-site-audit.yml'
      - 'scripts/live-site-audit.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run live browser audit
        run: node scripts/live-site-audit.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zflag-live-site-screenshots
          path: audit-*.png
          if-no-files-found: ignore
