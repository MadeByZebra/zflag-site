name: Verify translation service for static offline language packs
on:
  push:
    paths: ['.github/workflows/translation-service-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check network translation and HTML source extraction
        run: |
          python3 - <<'PY'
          import urllib.parse,urllib.request,json,time
          q="This documentation explains how to configure ZFLAG and export JSON."
          for lang in ("es","fr","zh"):
            url="https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl="+lang+"&dt=t&q="+urllib.parse.quote(q)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 ZFLAG-Localizer/1.0"})
              with urllib.request.urlopen(req,timeout=18) as response:
                payload=json.load(response)
              print(lang,"=>","".join(x[0] for x in payload[0]),flush=True)
            except Exception as e:
              print(lang,"ERROR",repr(e),flush=True)
          PY