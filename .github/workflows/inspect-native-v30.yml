name: Diagnose ZFLAG native process discovery without running injector
on:
  push:
    paths:
      - ".github/workflows/inspect-native-v30.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref_name == 'zflag-native-engine-2.0.26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract non-executable native process discovery source for review
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,zlib,pathlib,re
          root=pathlib.Path("native")
          data="".join((root/f"zflag_native_chunk{i}.txt").read_text().strip() for i in range(4))
          src=zlib.decompress(base64.b64decode(data)).decode("utf-8",errors="replace")
          lines=src.splitlines()
          print("TOTAL LINES",len(lines))
          patterns=[r'--apply',r'FindProcess',r'FindWindow',r'CreateToolhelp32Snapshot',r'OpenProcess',r'GetProcess',r'RobloxPlayer',r'PROCESS_',r'cached_fvar_container_rva',r'g_offsets_parsed',r'while\\s*\\(',r'Sleep\\s*\\(',r'VirtualQueryEx']
          positions=set()
          for pattern in patterns:
              matches=[n for n,line in enumerate(lines) if re.search(pattern,line,re.I)]
              print("PATTERN",pattern,"COUNT",len(matches),"LINES",matches[:25])
              positions.update(matches[:14])
          for i in sorted(positions):
              print(f"--- L{i+1} ---")
              for k in range(max(0,i-3),min(len(lines),i+4)):
                  print(f"{k+1:04} {lines[k][:350]}")
          PY
