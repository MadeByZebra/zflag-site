name: Inspect ZFLAG library value layout and nav animation
on:
  push:
    paths: ['.github/workflows/inspect-library-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show library grid CSS and view animation toggles
        run: |
          python3 - <<'PY'
          import base64,io,zipfile,pathlib,re
          archive=base64.b64decode(pathlib.Path('zflag-desktop-source.b64').read_text().strip())
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
            app=z.read('ZFLAG-Studio/src/App.tsx').decode()
            css=z.read('ZFLAG-Studio/src/index.css').decode()
          print('=== LAYOUT GRID ===')
          tokens=['.library-row {','.library-row-copy {','.library-header {','.library-results {','.library-row code {','.library-state {','.top-nav {','.topbar {','.page-transition {','.app-shell {','@keyframes page-in','@media (prefers-reduced-motion']
          for token in tokens:
            pos=0
            for j in range(12):
              k=css.find(token,pos)
              if k<0:break
              print('STYLE',token,'at',k,'=>',css[max(0,k-100):k+800].replace(chr(10),' ')[:880])
              pos=k+len(token)
          print('=== APP TOGGLES ===')
          for i,line in enumerate(app.splitlines()):
            if any(x in line for x in ['settings.animations','pageKey','className={cn("app-shell','className="app-shell','className="page-transition','mainScrollRef','className="top-nav']):
              print(f'LINE {i+1}: {line[:550]}')
          PY