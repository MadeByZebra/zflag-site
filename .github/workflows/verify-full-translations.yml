name: Verify complete ZFLAG website translations
on:
  push:
    paths:
      - 'scripts/full-localization-audit.cjs'
      - '.github/workflows/verify-full-translations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test LIVE published article translations, all 9 languages, and preserved JSON values
        env:
          ZFLAG_AUDIT_BASE: https://zflag.onrender.com
        run: node scripts/full-localization-audit.cjs
