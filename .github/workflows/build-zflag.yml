name: Build real ZFLAG Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-zflag.yml"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract the embedded ZFLAG source project
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import struct, zipfile, io, shutil

          exe = Path("ZFLAG-Setup-v2.0.22.exe")
          if not exe.exists():
              raise SystemExit("Legacy ZFLAG source wrapper is missing.")

          data = exe.read_bytes()
          eocd = data.rfind(b"PK\x05\x06")
          if eocd < 0:
              raise SystemExit("Embedded source ZIP was not found.")

          sig, disk, cd_disk, n_disk, n_total, cd_size, cd_offset, comment_len = struct.unpack_from("<4s4H2LH", data, eocd)
          start = eocd - cd_size - cd_offset
          end = eocd + 22 + comment_len

          if start < 0 or data[start:start+4] != b"PK\x03\x04":
              raise SystemExit("Embedded ZIP start could not be resolved.")

          out = Path("zflag-source")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()

          with zipfile.ZipFile(io.BytesIO(data[start:end])) as z:
              z.extractall(out)
              print(f"Extracted {len(z.namelist())} source files.")
          '@ | Set-Content -Encoding UTF8 extract_zflag.py
          python extract_zflag.py

      - name: Patch source for a real distributable build
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json

          root = Path("zflag-source")
          new_version = "2.0.23"

          # Keep all visible/internal versions aligned.
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".json",".toml",".rs",".tsx",".ts",".js",".mjs",".txt",".md",".bat",".ps1",".html",".css"}:
                  try:
                      text = p.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if "2.0.9" in text:
                      p.write_text(text.replace("2.0.9", new_version), encoding="utf-8")

          pkg_path = root / "package.json"
          pkg = json.loads(pkg_path.read_text(encoding="utf-8"))
          pkg["version"] = new_version
          pkg_path.write_text(json.dumps(pkg, indent=2) + "\n", encoding="utf-8")

          tauri_path = root / "src-tauri" / "tauri.conf.json"
          tauri = json.loads(tauri_path.read_text(encoding="utf-8"))
          tauri["version"] = new_version
          tauri.setdefault("bundle", {})["active"] = True
          tauri["bundle"]["targets"] = ["nsis"]
          tauri_path.write_text(json.dumps(tauri, indent=2) + "\n", encoding="utf-8")

          print("Patched source to ZFLAG", new_version)
          print("NSIS bundling enabled:", tauri["bundle"]["active"])
          '@ | Set-Content -Encoding UTF8 patch_zflag.py
          python patch_zflag.py

      - name: Install JavaScript dependencies
        working-directory: zflag-source
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: zflag-source
        shell: pwsh
        run: npm run build

      - name: Build self-contained backend sidecar
        working-directory: zflag-source
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-sidecar.ps1

      - name: Verify native build prerequisites
        working-directory: zflag-source
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          node --version
          python --version
          if (-not (Test-Path ".\src-tauri\binaries\fflag-backend-x86_64-pc-windows-msvc.exe")) {
            throw "Backend sidecar was not produced."
          }

      - name: Build native ZFLAG and NSIS installer
        working-directory: zflag-source
        shell: pwsh
        run: npm run desktop:build -- --bundles nsis

      - name: Verify installer and stage website download
        shell: pwsh
        run: |
          $installer = Get-ChildItem ".\zflag-source\src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "Tauri finished without producing an NSIS installer."
          }

          Copy-Item $installer.FullName ".\ZFLAG-Setup-v2.0.23.exe" -Force
          $size = (Get-Item ".\ZFLAG-Setup-v2.0.23.exe").Length
          if ($size -lt 5000000) {
            Write-Warning "Installer is smaller than expected ($size bytes); continuing, but artifact verification is recommended."
          }
          Write-Host "Built installer: $($installer.FullName)"
          Write-Host "Staged installer size: $size bytes"

      - name: Update website to the prebuilt installer
        shell: pwsh
        run: |
          $files = @("index.html", "render.yaml", "README.md", "DEPLOY-TO-RENDER.txt")
          foreach ($file in $files) {
            if (Test-Path $file) {
              $text = Get-Content $file -Raw
              $text = $text.Replace("ZFLAG-Setup-v2.0.22.exe", "ZFLAG-Setup-v2.0.23.exe")
              $text = $text.Replace("v2.0.22", "v2.0.23")
              $text = $text.Replace("2.0.22", "2.0.23")
              Set-Content -Encoding UTF8 $file $text
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZFLAG-2.0.23-Windows-Installer
          path: ZFLAG-Setup-v2.0.23.exe
          if-no-files-found: error

      - name: Publish fixed installer to the website repo
        shell: pwsh
        run: |
          git config user.name "ZFLAG Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ZFLAG-Setup-v2.0.23.exe index.html render.yaml README.md DEPLOY-TO-RENDER.txt
          git commit -m "Ship prebuilt ZFLAG 2.0.23 installer"
          git push
