services:
  - type: web
    name: zflag
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: test -s index.html && test -s docs/index.html && test -s zflag-favicon.svg && grep -q 'id="z-mini"' index.html && grep -q '2026-10-28-real-smooth-scroll-v4' index.html && grep -q 'atelier-editorial-grid' index.html && grep -q 'function applyAccent(requested)' index.html && grep -q 'accentStatus' index.html && grep -q 'White accent' index.html && grep -q 'zflag-demo-accent-v8' index.html && grep -q '2026-10-27-trueblack-v6' docs/index.html && grep -q 'zflag-logo.png?v=black-v6' docs/index.html && test -s zflag-logo.png && test -s library/index.html && test -s library/imports/ZFLAG_ALL_FLAGS_6_NEW_UPLOADS_MERGED.json && test -s library/imports/ALL_FFLAGS_EVERYTHING_COMBINED.json && grep -q 'Every flag.' library/index.html && grep -q 'isArchiveNote' library/index.html && test -s smooth-scroll.js && grep -q 'ZFLAG Smooth Scroll v4' smooth-scroll.js && grep -q 'smooth-scroll.js?v=4' index.html && grep -q 'smooth-scroll.js?v=4' docs/index.html && grep -q 'smooth-scroll.js?v=4' library/index.html && grep -q 'releases/download/v2.0.61/ZFLAG_Setup.exe' index.html && grep -q 'v2.0.61 ZFLAG_Setup.exe' docs/index.html && test -s build-status.txt && echo "ZFLAG v2.0.61 website with real smooth wheel v2 verified"
    staticPublishPath: .
    routes:
      - type: redirect
        source: /ZFLAG-Setup-v2.0.22.exe
        destination: /ZFLAG-Setup-v2.0.25.exe
    headers:
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /docs/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /smooth-scroll.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /library/*
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /zflag-favicon.svg
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /ZFLAG-Setup-v2.0.25.exe
        name: Content-Disposition
        value: 'attachment; filename="ZFLAG-Setup-v2.0.25.exe"'
      - path: /ZFLAG-Setup-v2.0.25.exe
        name: Content-Type
        value: application/octet-stream

