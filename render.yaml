services:
  - type: web
    name: zflag
    runtime: static
    buildCommand: echo "ZFLAG static site - no build required"
    staticPublishPath: .
    routes:
      - type: redirect
        source: /ZFLAG-Setup-v2.0.22.exe
        destination: /ZFLAG-Setup-v2.0.26.exe
    headers:
      - path: /ZFLAG-Setup-v2.0.26.exe
        name: Content-Disposition
        value: 'attachment; filename="ZFLAG-Setup-v2.0.26.exe"'
      - path: /ZFLAG-Setup-v2.0.26.exe
        name: Content-Type
        value: application/octet-stream

